<div class="grid">
    <div class="col-12">
        <div class="card">
            <!-- <h5>Plan</h5> -->
            <div class="p-fluid p-formgrid grid">
                <div class="field col-12 md:col-3">
                    <label htmlFor="Desc" class="required">Name </label>
                    <p-dropdown [options]="teamMembersList" [autoDisplayFirst]="false" optionLabel="name"
                        [filter]="true" filterBy="name" [showClear]="true" [(ngModel)]="teamMemberId"></p-dropdown>
                </div>

                <div class="field col-12 md:col-3">
                    <label htmlFor="irNo" class="required"> Date</label>
                    <!-- <input pInputText id="irNo" type="text" [(ngModel)]="dateTime" /> -->
                    <!-- <p-datepicker [(ngModel)]="dateTime" dateFormat="dd/mm/yy">
                    </p-datepicker> -->

                    <p-calendar id="basic" [showTime]="false" [hourFormat]="'12'" [(ngModel)]="date"
                        dateFormat="dd/mm/yy" (onSelect)="chageDateTime($event)"></p-calendar>
                </div>
                <div class="field col-12 md:col-3">
                    <label htmlFor="aResponse" class="required"> A Response</label>
                    <input pInputText pKeyFilter="int" id="aResponse" [(ngModel)]="aResponse" />
                </div>
                <div class="field col-12 md:col-3">
                    <label htmlFor="bResponse" class="required"> B Response</label>
                    <input pInputText pKeyFilter="int" id="bResponse" [(ngModel)]="bResponse" />
                </div>
                <div class="field col-12 md:col-3">
                    <label htmlFor="cResponse" class="required"> C Response</label>
                    <input pInputText pKeyFilter="int" id="cResponse" [(ngModel)]="cResponse" />
                </div>

                <div class="field col-12 md:col-3">
                    <label htmlFor="newContact" class="required"> New Contact</label>
                    <input pInputText pKeyFilter="int" id="newContact" [(ngModel)]="newContact" />
                </div>






                <div class="field col-12 md:col-4">
                    <div class="flex flex-wrap gap-2 f-r">

                        <p-button [label]="buttonName" (click)="save()" icon="pi pi-bookmark" iconPos="right"
                            [loading]="loading[1]" styleClass="p-button-success"></p-button>
                        <p-button label="Clear" (click)="Load()" icon="pi pi-times" [loading]="loading[0]"
                            styleClass="p-button-danger"></p-button>
                    </div>
                </div>

            </div>


        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <p-table [value]="infolists"  [tableStyle]="{'min-width': '50rem'}" styleClass="p-datatable-sm">
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th>Sno</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>A Response</th>
                        <th>B Response</th>
                        <th>C Response</th>
                        <th>New Contact</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex" let-columns="columns">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td>{{ rowData.name }}</td>
                        <td>{{ rowData.date | date:'dd/MM/yyyy' }}</td>
                        <td>{{ rowData.aResponse }}</td>
                        <td>{{ rowData.bResponse }}</td>
                        <td>{{ rowData.cResponse }}</td>
                        <td>{{ rowData.newContact }}</td>

                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6">No data found.</td>
                    </tr>
                </ng-template>

            </p-table>
        </div>
    </div>
</div>
