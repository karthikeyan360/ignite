<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Product Master</h5>
            <div class="p-fluid p-formgrid grid">
                <div class="field col-12 md:col-4">
                    <label htmlFor="Name">Product Name</label>
                    <input pInputText id="Name" type="text" [(ngModel)]="name" />
                </div>
                <!-- <div class="field col-12 md:col-4">
                    <label htmlFor="Desc">Desc</label>
                    <input pInputText id="Desc" type="text" [(ngModel)]="desc" />
                </div> -->
                <div class="field col-12 md:col-8">
                    <div class="flex flex-wrap gap-2 f-r">

                        <p-button [label]="buttonName" (click)="save()" icon="pi pi-bookmark" iconPos="right"
                            [loading]="loading[1]" styleClass="p-button-success"></p-button>
                        <p-button label="Clear" (click)="Load()" icon="pi pi-times" [loading]="loading[0]"
                            styleClass="p-button-danger"></p-button>
                    </div>
                </div>

            </div>

            <p-table [value]="DimLists" [tableStyle]="{'min-width': '50rem'}" styleClass="p-datatable-sm">
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th>
                            <div class="flex flex-wrap gap-2">
                                <p-button icon="pi pi-plus" (click)="Add()" styleClass="p-button-success"></p-button>

                            </div>

                        </th>
                        <th>Inner Length </th>
                        <th>Inner Width</th>
                        <th>Inner Height</th>
                        <!-- <th>Duration(Hrs)</th> -->
                        <th>Category</th> 
                        <th>Desc</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-index="rowIndex" let-columns="columns">
                    <tr>
                        <td> <p-button icon="pi pi-times" (click)="Remove(index)"
                                styleClass="p-button-danger"></p-button></td>
                        <td>
                            <!-- <input pInputText id="Name" class="t-r"  appNumbersOnly appTwoDecimalOnly  appValueZeroRmove type="int"   [(ngModel)]="product.length"/> -->
                            <p-inputNumber mode="decimal" inputId="withoutgrouping" [useGrouping]="false"
                                [(ngModel)]="product.length" [maxFractionDigits]="2"> </p-inputNumber>

                        </td>
                        

                        <td>
                            <p-inputNumber mode="decimal" inputId="withoutgrouping" [useGrouping]="false"
                                [(ngModel)]="product.width" [maxFractionDigits]="2"> </p-inputNumber>
                        </td>

                        <td>

                            <p-inputNumber mode="decimal" inputId="withoutgrouping" [useGrouping]="false"
                                [(ngModel)]="product.height" [maxFractionDigits]="2"> </p-inputNumber>
                        </td>
                        <td>
                        <p-dropdown [options]="CategoryLists" appendTo="body" [(ngModel)]="product.category" [autoDisplayFirst]="false"
                        optionLabel="name"  filterBy="name" [showClear]="true" (onChange)="onChangeCategory(product)"></p-dropdown>
                        </td>
                        <!-- <td>
                            <input pInputText id="Name" class="t-r" appValueZeroRmove type="text"
                                [(ngModel)]="product.time" />
                        </td> -->
                        <td>
                            <input pInputText id="Name" type="text" [(ngModel)]="product.description" />
                        </td>
                        <!-- <td>
                            <input pInputText id="Name" type="text" [(ngModel)]="product.description" />
                        </td> -->
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6">No Record(s) found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <p-table [value]="lists" [tableStyle]="{'min-width': '50rem'}" styleClass="p-datatable-sm">
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th>
                            Sno

                        </th>
                        <th>Name </th>
                        <!-- <th>Desc</th> -->
                        <th>Details</th>
                        <th>Edit</th>
                        <th>Delete</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-index="rowIndex" let-columns="columns">
                    <tr>
                        <td> {{index+1}} </td>
                        <td>
                            {{product.ModelName}}
                        </td>
                        <!-- <td>
                            {{product.Description}}
                        </td> -->
                        <td>
                            {{product.Dimension}}
                        </td>
                        <td>
                            <p-button icon="pi pi-file-edit" [loading]="loading[2]" (click)="ViewProduct(product)"
                                styleClass="p-button-success"></p-button>
                        </td>
                        <td> <p-button icon="pi pi-times" [loading]="loading[3]" (click)="DeleteProduct(product)"
                                styleClass="p-button-danger"></p-button></td>

                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6">No Record(s) found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

</div>
