<div class="grid">
    <div class="col-12">
        <div class="card">
            
            <div class="p-fluid p-form grid ">
                <div class="field col-12 md:col-4">
                <h5>Production Lists
                </h5>
                </div>
            <div class="field col-12 md:col-8">
                <div class="flex flex-wrap gap-2 f-r">
                    <p-button label="Re-Load"  icon="pi pi-history" iconPos="right"
                       styleClass="p-button-success" (click)="load()"></p-button>

                    <p-button label="Type One" routerLink="/production/typeOneEntry" icon="pi pi-bookmark" iconPos="right"
                        styleClass="p-button-info"></p-button>
                    <p-button label="Type Two" icon="pi pi-bookmark"
                        styleClass="p-button-help"  routerLink="/production/typeTwoEntry"></p-button>
                    </div>
                </div>

            </div> 

        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <p-table [value]="lists" [tableStyle]="{'min-width': '50rem'}" styleClass="p-datatable-sm">
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th>
                            Sno

                        </th>
                        <th>Prod No </th>
                        <th> Prod Type</th>
                        <th>Date</th>
                        <th>Customer Name</th>
                        
                        <th>Edit</th>
                        <th>Delete</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-index="rowIndex" let-columns="columns">
                    <tr>
                        <td> {{index+1}} </td>
                        <td>
                            {{product.ProdNo}}
                        </td>
                        <td>
                            {{product.Type}}
                        </td>
                        <td>
                            {{product.CreatedDate}}
                        </td>
                        <td>
                            {{product.CustomerName}}
                        </td>
                        
                        <td>
                            <p-button icon="pi pi-file-edit"
                                styleClass="p-button-success"></p-button>
                        </td>
                        <td> <p-button icon="pi pi-times" 
                                styleClass="p-button-danger"></p-button></td>

                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="8">No Record(s) found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
